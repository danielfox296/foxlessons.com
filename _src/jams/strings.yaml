# 7.2: shown whole on the first-jam guide. Level 4 drops the handoff's
# leading fragment ("Experienced players.") under VOICE.md.
skill_levels:
  - level: "1"
    text: First time on any stage is fine. The host helps you through it.
  - level: "2"
    text: You can play basic chords or a groove and follow along. Wrong notes are no big deal.
  - level: "3"
    text: You can hold your part and take a solo or a verse, and you know the common tunes.
  - level: "4"
    text: People expect you to know the tunes or forms by name and keep up.
  - level: "5"
    text: Working pros sit in. Come ready to play at the level of a paid gig.
  - level: No info
    text: Nobody has rated this night yet.

# 7.2, summarized for the genre pages' prep sections. Bands match the cards.
skill_bands:
  - band: "1-2"
    label: 1 to 2, first-timer friendly
    text: Your first time on any stage is fine, and so is playing basic chords or a groove and following along.
  - band: "3"
    label: 3, middle
    text: You hold your part, take a solo or a verse, and know the common tunes.
  - band: "4-5"
    label: 4 to 5, experienced
    text: People expect you to know the tunes by name and keep up, and working pros sit in.

