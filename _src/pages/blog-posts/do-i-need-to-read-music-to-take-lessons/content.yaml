llms_description: "Answer-shaped post from Daniel Fox, a Denver music teacher (bass, guitar, drums, piano, Logic Pro production, in-home or online). You do not need to read music to take lessons with him; he teaches chord charts and ear, not sight-reading. Explains what a chord chart contains versus standard notation, what a chord-chart player can and can't do, that music theory still sits under everything (jazz, pop, rock, R&B and flamenco as different palettes of the same theory), and who does need notation (orchestral and classical-program students), whom he refers elsewhere."
