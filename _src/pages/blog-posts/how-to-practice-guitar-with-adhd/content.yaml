sections:
  - type: key_takeaways
    items:
      - "Play music you actually care about. Interest is what keeps an ADHD player playing, and self-chosen songs are the strongest predictor of sticking with it in the research on everyone."
      - "Go for the feel of a thing and don't count minutes. If you get the lick down in five minutes, you're done with it."
      - "Starting is usually the wall, so design for it. Keep the guitar out of the case, in the room where you already sit."

  - type: prose
    body: |
      Practicing guitar with ADHD is a design problem. Sessions built on
      interest, variety, and quick wins work, and minute quotas, assigned
      songs and shame don't. Here is how I set
      practice up with my students, and how to set it up for yourself.

  - type: subhead
    text: "Why is practicing guitar so hard with ADHD?"

  - type: prose
    body: |
      Usually the wall is starting, because most ADHD players care intensely
      about music. The guitar is in its case, the case is in another room,
      and the ten seconds of friction between wanting to play and playing is
      where the whole evening goes.

      Then the guilt makes it worse. A blank week turns into a story about
      being someone who quits, you open the case less, and by week three the
      guitar is a monument to self-blame. That's what happens when practice
      is designed for someone else's attention.

  - type: subhead
    text: "What should a practice session look like?"

  - type: prose
    body: |
      It should be short, varied, and yours. We work on real songs you're
      actually interested in, immediately, and I bring in exercises only as
      far as they serve a song you want to play.

      Inside a session, switching is allowed. We can change songs. We can
      switch what we're working on entirely if that's what resets you. I only
      push on something when you're close to a breakthrough. Otherwise we
      follow whatever's interesting. Music is physical, so moving, standing
      up, and playing something loud for a minute are all normal parts of
      practice.

      And the target is never a timer.

  - type: pullquote
    text: "We're really going for a feeling, not minutes. If somebody gets a lick down in five minutes instead of 20, then they're done."

  - type: subhead
    text: "How do I start when I can't start?"

  - type: prose
    body: |
      Put the guitar where you sit, out of the case, on a stand, in the
      middle of the room if that's what it takes. A lot of times that alone
      does it, because the ten seconds of friction are gone and the
      instrument is right there.

      If it still isn't happening, the fix is coaching rather than willpower.
      We figure out what pulls you toward the guitar and what you're afraid
      of, and we work with both. After a blank week there's no shame ritual. We
      problem-solve what got in the way, reconnect the playing to what you
      actually care about, and start again. Restarts are the norm, and we
      plan for them.

  - type: subhead
    text: "Do apps help or hurt?"

  - type: prose
    body: |
      Both. Play-along apps are good at getting you to show up, and the
      streak mechanics help a lot of ADHD players, so keep the app.

      Here is what I noticed after years of playing along with records:
      playing along feels really good, but you don't necessarily critique
      yourself. When the headphones are on and the band sounds wonderful, you
      are captured by the emotion of it, and your own technique rides along
      unexamined. That's the app's blind spot too, since it can see your notes
      and can't see your hands. Pair the app with a teacher who watches you play and
      you get both halves. I wrote a fuller comparison in
      [apps versus a teacher](../compare/apps-vs-a-teacher/).

  - type: subhead
    text: "Do I need a diagnosis to ask for lessons like this?"

  - type: prose
    body: |
      No. You don't need a diagnosis to want lessons that work this way.
      This is simply how I teach: interest first, movement normal, feedback
      calibrated to your goals. Founding students also get direct text access
      between lessons and a midweek check-in by text or call, for
      accountability and hard spots.

      I'm a music teacher, not a music therapist. My job is helping you play. If you're looking for clinical
      goals with music, Denver has board-certified music therapists, and I'm
      glad to point you toward them. Everything on
      [the ADHD lessons page](../adhd/) describes teaching, nothing more.

