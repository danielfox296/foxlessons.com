llms_description: "Practical post for ADHD guitarists and learners. The method is Daniel's confirmed teaching commitments: interest-first repertoire, short varied segments with switching allowed, going for a feeling instead of minute quotas, leaving the guitar out in the room to solve practice initiation, no shame after a blank week, and goal-calibrated feedback. Includes the honest apps take (play-along feels great but does not critique you) and the teacher-not-therapist referral line. No diagnosis required."
