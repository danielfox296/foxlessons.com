<section class="section--dark play-section" data-play="drums">
  <div class="container play-head">
    <span class="eyebrow">Go ahead, play it</span>
    <h2>Hit something.</h2>
    <p>Kick, snare, hat, and crash, synthesized from scratch in your browser. Tap the pads or use Z X C V. Time and feel start with two hands and a pulse, and the patterns behind this page jump when you land one.</p>
  </div>
  <div class="container">
    <div class="play-pads" aria-label="Playable drum pads">
      <button class="ppad" data-hit="kick" data-key="z"><span class="ppad-name">Kick</span><span class="ppad-key">Z</span></button>
      <button class="ppad" data-hit="snare" data-key="x"><span class="ppad-name">Snare</span><span class="ppad-key">X</span></button>
      <button class="ppad" data-hit="hat" data-key="c"><span class="ppad-name">Hat</span><span class="ppad-key">C</span></button>
      <button class="ppad" data-hit="crash" data-key="v"><span class="ppad-name">Crash</span><span class="ppad-key">V</span></button>
    </div>
    <p class="play-note">A toy, honestly. For the real thing, <a href="{{css_path}}book/">book a lesson</a>.</p>
  </div>
  <script src="{{css_path}}js/play.js" defer></script>
</section>
